<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picture Plane</title>
<meta name="description" content="Look at art, decide quickly, and learn what you respond to.">
<meta name="theme-color" content="#2b2f36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Picture Plane">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<a class="skip" href="#controls">Skip to controls</a>
<header class="topbar">
  <p class="wordmark" aria-label="Picture Plane"><span class="mark" aria-hidden="true"></span>Picture Plane</p>
  <button class="levelchip" id="levelChip" type="button"></button>
</header>

<main>
  <section id="view-look" class="view look" aria-label="Look">
    <div class="nudge" id="nudge" hidden><span>A lot has changed since your last backup.</span><button class="btn small" id="nudgeGo">Back up</button></div>
    <div class="questbar" id="questBar" hidden role="status"><span id="questText"></span><button class="textbtn" id="questEnd" type="button">End</button></div>
    <div class="stage-wrap">
      <div class="edge" id="edge-pass" aria-hidden="true"><span>Pass</span></div>
      <div class="edge" id="edge-keep" aria-hidden="true"><span>Keep</span></div>
      <div class="edge" id="edge-love" aria-hidden="true"><span>Love</span></div>
      <div class="edge" id="edge-later" aria-hidden="true"><span>Later</span></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="why" id="why" hidden role="group" aria-label="What drew you in"></div>
    <div class="controls" id="controls">
      <button class="ctl ghost" id="btnUndo" type="button" aria-label="Undo" title="Undo (Backspace)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ctl pass" id="btnPass" type="button" aria-label="Pass" title="Pass (Left arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="ctl later" id="btnLater" type="button" aria-label="Decide later" title="Later (Down arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
      <button class="ctl keep" id="btnKeep" type="button" aria-label="Keep" title="Keep (Right arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg></button>
      <button class="ctl love" id="btnLove" type="button" aria-label="Love" title="Love (Up arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9L3.5 9.4l5.9-.8z"/></svg></button>
      <button class="ctl ghost" id="btnInfo" type="button" aria-label="Wall text" title="Wall text (I)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg></button>
    </div>
    <div class="aux"><button class="textbtn" id="btnNewStyle" type="button">New style</button><span class="dot" aria-hidden="true">·</span><button class="textbtn" id="btnQuests" type="button">Quests</button></div>
  </section>
  <section id="view-taste" class="view" aria-label="Taste" hidden></section>
  <section id="view-kept" class="view" aria-label="Kept" hidden></section>
  <section id="view-settings" class="view" aria-label="Settings" hidden></section>
</main>

<nav class="tabbar" aria-label="Main">
  <button id="tab-look" data-view="look" type="button" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="12"/><path d="M9 20h6"/></svg>Look</button>
  <button id="tab-taste" data-view="taste" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Taste</button>
  <button id="tab-kept" data-view="kept" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>Kept</button>
  <button id="tab-settings" data-view="settings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Wall text">
  <div class="sheet-top"><span class="grab" aria-hidden="true"></span><button class="btn small" id="sheetDone" type="button">Done</button></div>
  <div id="sheetBody"></div>
  <div class="sheet-actions" id="sheetActions" hidden>
    <div class="sheet-btns">
      <button class="ctl pass" data-act="pass" type="button" aria-label="Pass"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="ctl later" data-act="later" type="button" aria-label="Decide later"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
      <button class="ctl keep" data-act="keep" type="button" aria-label="Keep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg></button>
      <button class="ctl love" data-act="love" type="button" aria-label="Love"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9L3.5 9.4l5.9-.8z"/></svg></button>
    </div>
    <p class="sheet-hint" id="sheetHint">Or swipe this panel right to keep, left to pass</p>
  </div>
</aside>
<div class="zoom" id="zoom" hidden role="dialog" aria-label="Full size image"><img id="zoomImg" alt=""><button class="btn small" id="zoomClose" type="button">Close</button></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-card" id="modalBody"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
